[project]
name = "uk-trade-shock-study"
version = "0.1.0"
description = "Who Bears the Trade Shocks? Distributional incidence and fiscal cushioning of UK trade events, 2021-2026, through PolicyEngine UK"
requires-python = ">=3.13"
dependencies = [
    "policyengine-uk==2.95.0",
    "huggingface_hub",
    "pandas==2.3.3",
    "numpy==2.1.3",
    "matplotlib==3.10.0",
    "openpyxl==3.1.5",
    "requests==2.34.2",
    "microimpute>=1.8.1,<2",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uk_trade_shock_study"]



[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
